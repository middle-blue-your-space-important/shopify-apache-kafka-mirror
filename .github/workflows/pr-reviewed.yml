name: Pull Request Reviewed

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
    branches:
      - trunk
  pull_request:
    types: [opened, reopened, edited]
    branches:
      - trunk

jobs:
  save-pr-number:
    name: Save PR Number
    runs-on: ubuntu-latest
    steps:
      # - name: Env
      #   run: printenv
      #   env:
      #     GITHUB_CONTEXT: ${{ toJson(github) }}
      - name: Save PR Number
        run: |
          echo ${{ github.event.pull_request.number }} > PR_NUMBER.txt
          mkdir -p .github/scripts
          echo -e ""|base64 -d > .github/scripts/pr-format.py

      - uses: actions/upload-artifact@v4
        with:
          name: PR_NUMBER.txt
          path: |
            PR_NUMBER.txt
            .github/scripts/pr-format.py
